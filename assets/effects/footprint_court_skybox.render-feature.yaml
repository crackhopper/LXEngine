schema: lxe.render-feature.v1
name: FootprintCourtSkybox
feature: skybox
level: shader
shader:
  uri: features/skybox
parameters:
  environmentMap:
    kind: textureCube
    uri: assets/env/khronos/footprint_court/ggx/specular.ktx2
    valueType: linear-radiance
    binding: SkyboxMap
    required: true
  color:
    kind: vec3
    value: [1.0, 1.0, 1.0]
    binding: SkyboxUBO
    member: color
    required: true
  intensity:
    kind: float
    value: 1.0
    binding: SkyboxUBO
    member: intensity
    required: true
  rotation:
    kind: float
    value: 0.0
    binding: SkyboxUBO
    member: rotation
    required: true
