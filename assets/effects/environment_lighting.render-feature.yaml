schema: lxe.render-feature.v1
name: EnvironmentLighting
feature: environmentLighting
parameters:
  environmentMap:
    kind: textureCube
    uri: assets/env/khronos/neutral/ggx/specular.ktx2
    valueType: linear-radiance
    binding: SkyboxMap
    required: true
  color:
    kind: vec3
    value: [1.0, 1.0, 1.0]
    binding: EnvironmentLightingUBO
    member: color
    required: true
  intensity:
    kind: float
    value: 1.0
    binding: EnvironmentLightingUBO
    member: intensity
    required: true
  rotation:
    kind: float
    value: 0.0
    binding: EnvironmentLightingUBO
    member: rotation
    required: true
  backgroundMode:
    kind: enum
    value: infinite
    binding: EnvironmentLightingUBO
    member: backgroundMode
    required: true
    allowedValues: [none, infinite, finiteBox]
  finiteBoxBounds:
    kind: vec6
    value: [-5.0, 5.0, -2.0, 3.0, -5.0, 5.0]
    requiredWhen:
      parameter: backgroundMode
      equals: finiteBox
