scene:
  name: Realtime Offline Compare Flat
  gameplayCameraPath: /game_cam
  environment:
    enabled: false
    intensity: 0.0
    skyboxEnabled: false
  defaultOutputProfile: preview
  outputProfiles:
    preview:
      camera: /game_cam
      width: 128
      height: 128
      outputFormat: exr-png
      outDir: artifacts/compare/flat
  offlineRender:
    integrator: software-compute
    samples: 1
    maxBounce: 1
    seed: 1
    profile: preview
    shadows: false
    compareMode: albedo
root:
  nodeName: scene_root
  name: ''
  transform:
    translation: [0.0, 0.0, 0.0]
    rotation: [1.0, 0.0, 0.0, 0.0]
    scale: [1.0, 1.0, 1.0]
  visibilityMask: 4294967295
  children:
    - nodeName: game_camera
      name: game_cam
      transform:
        translation: [0.0, 0.0, 4.0]
        rotation: [1.0, 0.0, 0.0, 0.0]
        scale: [1.0, 1.0, 1.0]
      visibilityMask: 4294967295
      camera:
        type: perspective
        fovY: 40.0
        aspect: 1.0
        nearPlane: 0.1
        farPlane: 10.0
        cullingMask: 4294967295
    - nodeName: black_compare_sphere
      name: black_compare_sphere
      transform:
        translation: [0.0, 0.0, 0.0]
        rotation: [1.0, 0.0, 0.0, 0.0]
        scale: [5.0, 5.0, 5.0]
      visibilityMask: 4294967295
      mesh:
        uri: builtin://lxe_editor/primitives/sphere
      material:
        uri: assets/materials/blinnphong_lit.material
      nodeMaterialOverrides:
        MaterialUBO.baseColor: [0.0, 0.0, 0.0]
        MaterialUBO.specularIntensity: 0.0
    - nodeName: compare_key_light
      name: compare_key_light
      transform:
        translation: [0.0, 4.0, 4.0]
        rotation: [1.0, 0.0, 0.0, 0.0]
        scale: [1.0, 1.0, 1.0]
      visibilityMask: 4294967295
      light:
        kind: Directional
        direction: [-0.3, -1.0, -0.4]
        color: [1.0, 1.0, 1.0]
        intensity: 0.0
        shadowStrength: 0.0
        shadowDistance: 80.0
        shadowCascadeCount: 1
