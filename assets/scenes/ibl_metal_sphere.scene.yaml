scene:
  name: IBL Metal Sphere
  gameplayCameraPath: /game_cam
  environment:
    enabled: true
    hdrUri: assets/env/studio_small_03_2k.hdr
    skyboxEnabled: true
    intensity: 1.0
    roughnessMipCount: 5.0
  offlineRender:
    defaultProfile: preview
    profiles:
      preview:
        backend: vulkan-compute
        integrator: primary-ray
        width: 512
        height: 512
        samples: 1
        maxDepth: 1
        seed: 1
        outputFormat: exr-png
      mvp:
        backend: vulkan-compute
        integrator: primary-ray
        width: 1024
        height: 576
        samples: 4
        maxDepth: 1
        seed: 1
        outputFormat: exr-png
      reference:
        backend: vulkan-compute
        integrator: path-tracing
        width: 1920
        height: 1080
        samples: 64
        maxDepth: 4
        seed: 1
        outputFormat: exr-png
root:
  nodeName: scene_root
  name: ''
  transform:
    translation: [0.0, 0.0, 0.0]
    rotation: [1.0, 0.0, 0.0, 0.0]
    scale: [1.0, 1.0, 1.0]
  visibilityMask: 4294967295
  children:
    - nodeName: game_camera
      name: game_cam
      transform:
        translation: [0.0, 1.7, 5.0]
        rotation: [1.0, 0.0, 0.0, 0.0]
        scale: [1.0, 1.0, 1.0]
      visibilityMask: 4294967295
      camera:
        eye: [0.0, 1.7, 5.0]
        target: [0.0, 0.8, 0.0]
        up: [0.0, 1.0, 0.0]
        type: perspective
        fovY: 42.0
        aspect: 1.7777778
        nearPlane: 0.1
        farPlane: 120.0
        left: -1.0
        right: 1.0
        bottom: -1.0
        top: 1.0
        cullingMask: 4294967295
    - nodeName: ibl_ground
      name: ground_reference
      transform:
        translation: [0.0, -0.02, 0.0]
        rotation: [1.0, 0.0, 0.0, 0.0]
        scale: [7.0, 1.0, 7.0]
      visibilityMask: 4294967295
      mesh:
        uri: builtin://lxe_editor/primitives/plane
      material:
        uri: assets/materials/blinnphong_lit.material
      nodeMaterialOverrides:
        MaterialUBO.baseColor: [0.46, 0.48, 0.50]
    - nodeName: ibl_metal_sphere
      name: metal_sphere
      transform:
        translation: [0.0, 0.85, 0.0]
        rotation: [1.0, 0.0, 0.0, 0.0]
        scale: [1.5, 1.5, 1.5]
      visibilityMask: 4294967295
      mesh:
        uri: builtin://lxe_editor/primitives/sphere
      material:
        uri: assets/materials/pbr_gold.material
    - nodeName: dir_light_node
      name: dir_light
      transform:
        translation: [0.0, 0.0, 0.0]
        rotation: [1.0, 0.0, 0.0, 0.0]
        scale: [1.0, 1.0, 1.0]
      visibilityMask: 4294967295
      light:
        kind: Directional
        direction: [-0.35, -1.0, -0.25]
        color: [1.0, 0.96, 0.88]
        intensity: 0.8
        shadowStrength: 0.45
        shadowDistance: 80.0
        shadowCascadeCount: 4
