scene:
  name: IBL Metal Sphere
  gameplayCameraPath: /game_cam
  environment:
    enabled: true
    hdrUri: assets/env/studio_small_03_2k.hdr
    skyboxEnabled: true
    intensity: 1.0
    roughnessMipCount: 5.0
  rendering:
    shadows: true
  realtimeRender:
    ibl: true
    alphaTransparency: false
  defaultOutputProfile: preview
  outputProfiles:
    preview:
      camera: /game_cam
      width: 512
      height: 512
      outputFormat: exr-png
      outDir: artifacts/offline/preview
    mvp:
      camera: /game_cam
      width: 1024
      height: 576
      outputFormat: exr-png
      outDir: artifacts/offline/mvp
    reference:
      camera: /game_cam
      width: 1920
      height: 1080
      outputFormat: exr-png
      outDir: artifacts/offline/reference
  offlineRender:
    integrator: software-compute
    samples: 1
    maxBounce: 1
    seed: 1
    profile: preview
root:
  nodeName: scene_root
  name: ''
  transform:
    translation: [0.0, 0.0, 0.0]
    rotation: [1.0, 0.0, 0.0, 0.0]
    scale: [1.0, 1.0, 1.0]
  visibilityMask: 4294967295
  children:
    - nodeName: game_camera
      name: game_cam
      transform:
        translation: [0.0, 1.7, 5.0]
        rotation: [0.996038, -0.088929, 0.0, 0.0]
        scale: [1.0, 1.0, 1.0]
      visibilityMask: 4294967295
      camera:
        type: perspective
        fovY: 42.0
        aspect: 1.7777778
        nearPlane: 0.1
        farPlane: 120.0
        focusDistance: 5.080354
        cullingMask: 4294967295
    - nodeName: ibl_ground
      name: ground_reference
      transform:
        translation: [0.0, -0.02, 0.0]
        rotation: [1.0, 0.0, 0.0, 0.0]
        scale: [7.0, 1.0, 7.0]
      visibilityMask: 4294967295
      mesh:
        uri: builtin://lxe_editor/primitives/plane
      material:
        uri: assets/materials/blinnphong_lit.material
      nodeMaterialOverrides:
        MaterialUBO.baseColor: [0.46, 0.48, 0.50]
    - nodeName: ibl_metal_sphere
      name: metal_sphere
      transform:
        translation: [0.0, 0.85, 0.0]
        rotation: [1.0, 0.0, 0.0, 0.0]
        scale: [1.5, 1.5, 1.5]
      visibilityMask: 4294967295
      mesh:
        uri: builtin://lxe_editor/primitives/sphere
      material:
        uri: assets/materials/pbr_gold.material
    - nodeName: dir_light_node
      name: dir_light
      transform:
        translation: [0.0, 0.0, 0.0]
        rotation: [1.0, 0.0, 0.0, 0.0]
        scale: [1.0, 1.0, 1.0]
      visibilityMask: 4294967295
      light:
        kind: Directional
        direction: [-0.35, -1.0, -0.25]
        color: [1.0, 0.96, 0.88]
        intensity: 0.8
        shadowStrength: 0.45
        shadowDistance: 80.0
        shadowCascadeCount: 4
