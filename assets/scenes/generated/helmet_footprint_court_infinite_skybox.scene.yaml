scene:
  name: Helmet Footprint Court Infinite Skybox
  gameplayCameraPath: /game_cam
  environment:
    enabled: false
    intensity: 0.0
    ambientColor: [0.08, 0.08, 0.1]
    ambientIntensity: 0.0
    skyboxEnabled: false
  rendering:
    shadows: true
  defaultOutputProfile: raytracing-direct
  outputProfiles:
    forward-noIBL:
      camera: /game_cam
      renderPathGraph: assets/render_paths/helmet_skybox_forward_no_ibl.render-path.yaml
      width: 960
      height: 540
      outputFormat: exr-png
      outDir: artifacts/reference/helmet_footprint_forward_no_ibl
      backgroundColor: [0.0, 0.0, 0.0]
    forward-IBL:
      camera: /game_cam
      renderPathGraph: assets/render_paths/helmet_skybox_forward_ibl.render-path.yaml
      width: 960
      height: 540
      outputFormat: exr-png
      outDir: artifacts/reference/helmet_footprint_forward_ibl
      backgroundColor: [0.0, 0.0, 0.0]
    raytracing-direct:
      camera: /game_cam
      renderPathGraph: assets/render_paths/helmet_skybox_raytrace_direct.render-path.yaml
      width: 960
      height: 540
      outputFormat: exr-png
      outDir: artifacts/reference/helmet_footprint_raytrace_direct
      backgroundColor: [0.0, 0.0, 0.0]
    raytracing-two-bounce:
      camera: /game_cam
      renderPathGraph: assets/render_paths/helmet_skybox_raytrace_two_bounce.render-path.yaml
      width: 960
      height: 540
      outputFormat: exr-png
      outDir: artifacts/reference/helmet_footprint_raytrace_two_bounce
      backgroundColor: [0.0, 0.0, 0.0]
  offlineRender:
    profile: raytracing-direct
    integrator: software-compute
    samples: 1
    maxBounce: 1
    seed: 1
    compareMode: shaded
