scene:
  name: Realtime Offline Compare Diagnostic
  gameplayCameraPath: /game_cam
  environment:
    enabled: false
    intensity: 0.0
    skyboxEnabled: false
  defaultOutputProfile: preview
  outputProfiles:
    preview:
      camera: /game_cam
      width: 128
      height: 128
      outputFormat: exr-png
      outDir: artifacts/compare/diagnostic
      backgroundColor: [0.0, 0.0, 0.0]
  offlineRender:
    integrator: primary-ray
    samples: 1
    maxBounce: 1
    seed: 1
    profile: preview
    shadows: false
    compareMode: shaded
root:
  nodeName: scene_root
  name: ''
  transform:
    translation: [0.0, 0.0, 0.0]
    rotation: [1.0, 0.0, 0.0, 0.0]
