schema: lxe.render-path-graph.v1
name: EnvironmentIblBake
renderPath: OfflineRT

passes:
  - id: EnvironmentToCubemap
    stage: raster
    dispatch: fullscreen
    shader: render_paths/Bake/environment_to_cubemap
    input:
      kind: fullscreen-triangle
    rendering:
      mode: dynamic
      attachments:
        - target: bake.environment.cubemap
          format: RGBA16Float
          samples: 1
          layers: 6
    sources: [bake.environment.source]
    targets: [bake.environment.cubemap]
    payloads:
      - name: environment_cubemap
        target: bake.environment.cubemap
        format: RGBA16Float
        kind: cubemap
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: false

  - id: EnvironmentDiffuseSh9
    stage: compute
    dispatch: compute
    shader: render_paths/Bake/environment_diffuse_sh9
    input:
      kind: compute-dispatch
    sources: [bake.environment.cubemap]
    targets: [bake.environment.diffuse_sh9]
    payloads:
      - name: diffuse_sh9
        target: bake.environment.diffuse_sh9
        format: SH9RgbFloat
        kind: sh9
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: false

  - id: EnvironmentSpecularPrefilter
    stage: compute
    dispatch: compute
    shader: render_paths/Bake/environment_specular_prefilter
    input:
      kind: compute-dispatch
    sources: [bake.environment.cubemap]
    targets: [bake.environment.specular_prefilter]
    payloads:
      - name: specular_prefilter
        target: bake.environment.specular_prefilter
        format: RGBA16Float
        kind: cubemap
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: false
