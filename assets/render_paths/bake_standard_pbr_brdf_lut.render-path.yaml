schema: lxe.render-path-graph.v1
name: StandardPbrBrdfLutBake
renderPath: OfflineRT

passes:
  - id: StandardPbrBrdfLut
    stage: raster
    dispatch: fullscreen
    shader: render_paths/Bake/standard_pbr_brdf_lut
    input:
      kind: fullscreen-triangle
    rendering:
      mode: dynamic
      attachments:
        - target: bake.material.brdf_lut
          format: RG16Float
          samples: 1
          layers: 1
    sources: [bake.material.source]
    targets: [bake.material.brdf_lut]
    payloads:
      - name: brdf_lut
        target: bake.material.brdf_lut
        format: RG16Float
        kind: texture2d
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: false
