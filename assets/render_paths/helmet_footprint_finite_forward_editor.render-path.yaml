schema: lxe.render-path-graph.v1
name: HelmetFootprintFiniteForwardEditor
renderPath: Forward

features:
  forwardPass:
    uri: effects/forward_pass.render-feature.yaml
  toneMapping:
    uri: effects/tone_mapping.render-feature.yaml
  surfaceLighting:
    uri: effects/surface_lighting_no_ibl.render-feature.yaml
  bloom:
    uri: effects/bloom.render-feature.yaml

passes:
  - id: Shadow
    stage: raster
    dispatch: draw
    shader: render_paths/Forward/shadow_depth_only
    input:
      kind: scene-renderables
      material:
        type: [standard-pbr]
        required: true
      geometry:
        vertex: position-only
        topology: triangle-list
    rendering:
      mode: dynamic
      attachments:
        - target: shadow.main
          format: D32Float
          samples: 1
          layers: 1
          depth: true
    sources:
      - geometry.vertex
      - geometry.index
      - scene.camera
      - scene.lights
    targets: [shadow.main]
    renderState:
      cullMode: Back
      depthTest: true
      depthWrite: true
      depthOp: LessEqual
      blendEnable: false

  - id: Forward
    stage: raster
    dispatch: draw
    shader: render_paths/Forward/pbr
    input:
      kind: scene-renderables
      material:
        type: [standard-pbr, unlit-texture]
        required: true
      batching:
        mode: material
      geometry:
        vertex: position-only
        topology: triangle-list
    rendering:
      mode: dynamic
      attachments:
        - target: hdr.color
          format: RGBA16Float
          samples: 1
          layers: 1
        - target: depth.main
          format: D32Float
          samples: 1
          layers: 1
          depth: true
    sources:
      - geometry.vertex
      - geometry.index
      - material.bsdf
      - scene.camera
      - scene.lights
      - feature.forwardPass
      - feature.surfaceLighting
      - feature.toneMapping
    targets: [hdr.color, depth.main]
    renderState:
      cullMode: Back
      depthTest: true
      depthWrite: true
      depthOp: LessEqual
      blendEnable: false

  - id: Bloom
    stage: raster
    dispatch: fullscreen
    shader: render_paths/Bloom/blit
    input:
      kind: fullscreen-triangle
    rendering:
      mode: dynamic
      attachments:
        - target: swapchain.color
          format: BGRA8
          samples: 1
          layers: 1
    sources:
      - hdr.color
      - feature.bloom
    targets: [swapchain.color]
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: false

  - id: DebugOverlay
    stage: raster
    dispatch: draw
    shader: render_paths/Debug/debug_overlay
    input:
      kind: scene-renderables
      object:
        renderClass: [debug.mesh]
      material:
        required: false
      geometry:
        vertex: position-only
        topology: line-list
    rendering:
      mode: dynamic
      attachments:
        - target: debug.overlay
          format: BGRA8
          samples: 1
          layers: 1
    sources: [scene.camera]
    targets: [debug.overlay]
    writeMode: append
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: true
      srcBlend: SrcAlpha
      dstBlend: OneMinusSrcAlpha
