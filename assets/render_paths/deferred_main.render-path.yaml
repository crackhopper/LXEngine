schema: lxe.render-path-graph.v1
name: DeferredMain
renderPath: Deferred

features:
  toneMapping:
    uri: effects/tone_mapping.render-feature.yaml

passes:
  - id: Shadow
    stage: raster
    dispatch: draw
    shader: render_paths/Forward/shadow_depth_only
    input:
      kind: scene-renderables
      material:
        type: [matte, uber, metal, substrate, standard-pbr]
        required: true
      geometry:
        vertex: position-only
        topology: triangle-list
    rendering:
      mode: dynamic
      attachments:
        - target: shadow.main
          format: D32Float
          samples: 1
          layers: 1
          depth: true
    sources:
      - geometry.vertex
      - geometry.index
      - scene.camera
      - scene.lights
    targets: [shadow.main]
    renderState:
      cullMode: Back
      depthTest: true
      depthWrite: true
      depthOp: LessEqual
      blendEnable: false

  - id: Deferred
    stage: raster
    dispatch: draw
    shader: render_paths/Deferred/pbr_gbuffer
    input:
      kind: scene-renderables
      material:
        type: [matte, uber, metal, substrate, standard-pbr]
        required: true
      geometry:
        vertex: position-only
        topology: triangle-list
    rendering:
      mode: dynamic
      attachments:
        - target: gbuffer.albedoAlpha
          format: RGBA8
          samples: 1
          layers: 1
        - target: gbuffer.normalRoughness
          format: RGBA16Float
          samples: 1
          layers: 1
        - target: gbuffer.material
          format: RGBA8
          samples: 1
          layers: 1
        - target: depth.main
          format: D32Float
          samples: 1
          layers: 1
          depth: true
    sources:
      - geometry.vertex
      - geometry.index
      - material.bsdf
      - scene.camera
      - scene.lights
    targets:
      - gbuffer.albedoAlpha
      - gbuffer.normalRoughness
      - gbuffer.material
      - depth.main
    renderState:
      cullMode: Back
      depthTest: true
      depthWrite: true
      depthOp: LessEqual
      blendEnable: false

  - id: DeferredLighting
    stage: raster
    dispatch: fullscreen
    shader: render_paths/Deferred/deferred_lighting
    input:
      kind: fullscreen-triangle
    rendering:
      mode: dynamic
      attachments:
        - target: hdr.color
          format: RGBA16Float
          samples: 1
          layers: 1
    sources:
      - gbuffer.albedoAlpha
      - gbuffer.normalRoughness
      - gbuffer.material
      - depth.main
    targets: [hdr.color]
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: false

  - id: PostProcess
    stage: raster
    dispatch: fullscreen
    shader: render_paths/Post/post_process
    input:
      kind: fullscreen-triangle
    rendering:
      mode: dynamic
      attachments:
        - target: swapchain.color
          format: BGRA8
          samples: 1
          layers: 1
    sources: [hdr.color, feature.toneMapping]
    targets: [swapchain.color]
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: false

  - id: DebugOverlay
    stage: raster
    dispatch: draw
    shader: render_paths/Debug/debug_overlay
    input:
      kind: scene-renderables
      object:
        renderClass: [debug.mesh]
      material:
        required: false
      geometry:
        vertex: position-only
        topology: line-list
    rendering:
      mode: dynamic
      attachments:
        - target: debug.overlay
          format: BGRA8
          samples: 1
          layers: 1
    sources: [scene.camera]
    targets: [debug.overlay]
    writeMode: append
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: true
      srcBlend: SrcAlpha
      dstBlend: OneMinusSrcAlpha
