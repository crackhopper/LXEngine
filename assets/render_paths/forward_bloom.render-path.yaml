schema: lxe.render-path-graph.v1
name: ForwardBloom
renderPath: Forward

features:
  toneMapping:
    uri: effects/tone_mapping.render-feature.yaml
  environmentLighting:
    uri: effects/environment_lighting.render-feature.yaml

passes:
  - id: Shadow
    stage: raster
    dispatch: draw
    shader: render_paths/Forward/shadow_depth_only
    input:
      kind: scene-renderables
      material:
        type: [matte, uber, metal, substrate, standard-pbr]
        required: true
      geometry:
        vertex: position-only
        topology: triangle-list
    rendering:
      mode: dynamic
      attachments:
        - target: shadow.main
          format: D32Float
          samples: 1
          layers: 1
          depth: true
    sources:
      - geometry.vertex
      - geometry.index
      - scene.camera
      - scene.lights
    targets: [shadow.main]
    renderState:
      cullMode: Back
      depthTest: true
      depthWrite: true
      depthOp: LessEqual
      blendEnable: false

  - id: Forward
    stage: raster
    dispatch: draw
    shader: render_paths/Forward/pbr
    input:
      kind: scene-renderables
      material:
        type: [matte, uber, metal, substrate, standard-pbr]
        required: true
      geometry:
        vertex: position-only
        topology: triangle-list
    rendering:
      mode: dynamic
      attachments:
        - target: hdr.color
          format: RGBA16Float
          samples: 1
          layers: 1
        - target: depth.main
          format: D32Float
          samples: 1
          layers: 1
          depth: true
    sources:
      - geometry.vertex
      - geometry.index
      - material.bsdf
      - scene.camera
      - scene.lights
    targets: [hdr.color, depth.main]
    renderState:
      cullMode: Back
      depthTest: true
      depthWrite: true
      depthOp: LessEqual
      blendEnable: false

  - id: EnvironmentBox
    stage: raster
    dispatch: draw
    shader: render_paths/Environment/environment_box
    input:
      kind: scene-renderables
      object:
        renderClass: [environment.box]
      material:
        type: [environment-box]
        required: true
      geometry:
        vertex: position-only
        topology: triangle-list
    rendering:
      mode: dynamic
      attachments:
        - target: hdr.color
          format: RGBA16Float
          samples: 1
          layers: 1
          attachmentUsage: color-attachment-write
        - target: depth.main
          format: D32Float
          samples: 1
          layers: 1
          depth: true
          attachmentUsage: depth-attachment-read-only
    sources: [geometry.vertex, geometry.index, scene.camera, feature.environmentLighting, depth.main]
    targets: [hdr.color]
    writeMode: append
    renderState:
      cullMode: Front
      depthTest: true
      depthWrite: false
      depthOp: LessEqual
      blendEnable: false

  - id: SkyboxBackground
    stage: raster
    dispatch: fullscreen
    shader: render_paths/Skybox/skybox_background
    input:
      kind: fullscreen-triangle
    rendering:
      mode: dynamic
      attachments:
        - target: hdr.color
          format: RGBA16Float
          samples: 1
          layers: 1
          attachmentUsage: color-attachment-write
        - target: depth.main
          format: D32Float
          samples: 1
          layers: 1
          depth: true
          attachmentUsage: depth-attachment-read-only
    sources: [feature.environmentLighting, depth.main]
    targets: [hdr.color]
    writeMode: append
    renderState:
      cullMode: None
      depthTest: true
      depthWrite: false
      depthOp: LessEqual
      blendEnable: false

  - id: BloomThreshold
    stage: raster
    dispatch: fullscreen
    shader: render_paths/Post/bloom_threshold
    input:
      kind: fullscreen-triangle
    rendering:
      mode: dynamic
      attachments:
        - target: bloom.threshold
          format: RGBA16Float
          samples: 1
          layers: 1
    sources: [hdr.color]
    targets: [bloom.threshold]
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: false

  - id: BloomBlurH
    stage: raster
    dispatch: fullscreen
    shader: render_paths/Post/bloom_blur_h
    input:
      kind: fullscreen-triangle
    rendering:
      mode: dynamic
      attachments:
        - target: bloom.blurH
          format: RGBA16Float
          samples: 1
          layers: 1
    sources: [bloom.threshold]
    targets: [bloom.blurH]
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: false

  - id: BloomBlurV
    stage: raster
    dispatch: fullscreen
    shader: render_paths/Post/bloom_blur_v
    input:
      kind: fullscreen-triangle
    rendering:
      mode: dynamic
      attachments:
        - target: bloom.blur
          format: RGBA16Float
          samples: 1
          layers: 1
    sources: [bloom.blurH]
    targets: [bloom.blur]
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: false

  - id: PostProcess
    stage: raster
    dispatch: fullscreen
    shader: render_paths/Post/post_process
    input:
      kind: fullscreen-triangle
    rendering:
      mode: dynamic
      attachments:
        - target: swapchain.color
          format: BGRA8
          samples: 1
          layers: 1
    sources: [hdr.color, bloom.blur, feature.toneMapping]
    targets: [swapchain.color]
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: false

  - id: DebugOverlay
    stage: raster
    dispatch: draw
    shader: render_paths/Debug/debug_overlay
    input:
      kind: scene-renderables
      object:
        renderClass: [debug.mesh]
      material:
        required: false
      geometry:
        vertex: position-only
        topology: line-list
    rendering:
      mode: dynamic
      attachments:
        - target: debug.overlay
          format: BGRA8
          samples: 1
          layers: 1
    sources: [scene.camera]
    targets: [debug.overlay]
    writeMode: append
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: true
      srcBlend: SrcAlpha
      dstBlend: OneMinusSrcAlpha
