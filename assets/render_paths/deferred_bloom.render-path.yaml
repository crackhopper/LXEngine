schema: lxe.render-path-graph.v1
name: DeferredBloom
renderPath: Deferred

features:
  toneMapping:
    uri: effects/tone_mapping.render-feature.yaml

passes:
  - id: Shadow
    stage: raster
    dispatch: draw
    shader: techniques/Forward/shadow_depth_only
    filters:
      renderClass: [surface.opaque]
      bsdf: [matte, uber, metal, substrate]
    sources:
      - geometry.vertex
      - geometry.index
      - material.bsdf
      - scene.camera
      - scene.lights
    targets: [shadow.main]
    renderState:
      cullMode: Back
      depthTest: true
      depthWrite: true
      depthOp: LessEqual
      blendEnable: false

  - id: Deferred
    stage: raster
    dispatch: draw
    shader: techniques/Deferred/gbuffer
    filters:
      renderClass: [surface.opaque]
      bsdf: [matte, uber, metal, substrate]
    sources:
      - geometry.vertex
      - geometry.index
      - material.bsdf
      - scene.camera
      - scene.lights
    targets:
      - gbuffer.albedoAlpha
      - gbuffer.normalRoughness
      - gbuffer.material
      - depth.main
    renderState:
      cullMode: Back
      depthTest: true
      depthWrite: true
      depthOp: LessEqual
      blendEnable: false

  - id: DeferredLighting
    stage: raster
    dispatch: fullscreen
    shader: deferred_lighting
    sources:
      - gbuffer.albedoAlpha
      - gbuffer.normalRoughness
      - gbuffer.material
      - depth.main
    targets: [hdr.color]
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: false

  - id: BloomThreshold
    stage: raster
    dispatch: fullscreen
    shader: bloom_threshold
    sources: [hdr.color]
    targets: [bloom.threshold]
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: false

  - id: BloomBlurH
    stage: raster
    dispatch: fullscreen
    shader: bloom_blur_h
    sources: [bloom.threshold]
    targets: [bloom.blurH]
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: false

  - id: BloomBlurV
    stage: raster
    dispatch: fullscreen
    shader: bloom_blur_v
    sources: [bloom.blurH]
    targets: [bloom.blur]
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: false

  - id: PostProcess
    stage: raster
    dispatch: fullscreen
    shader: post_process
    sources: [hdr.color, bloom.blur, feature.toneMapping]
    targets: [swapchain.color]
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: false

  - id: DebugOverlay
    stage: raster
    dispatch: draw
    shader: debug_overlay
    sources: [scene.camera]
    targets: [debug.overlay]
    writeMode: append
    renderState:
      cullMode: None
      depthTest: false
      depthWrite: false
      depthOp: Always
      blendEnable: true
      srcBlend: SrcAlpha
      dstBlend: OneMinusSrcAlpha
